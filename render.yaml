services:
  # --------------------------------
  # 1. Backend Web Service
  # --------------------------------
  - type: web
    name: weathergpt-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in the Render Dashboard
      - key: GEMINI_API_KEY
        sync: false # Set this in the Render Dashboard
      - key: DEBUG
        value: "false"

  # --------------------------------
  # 2. Frontend Static Site
  # --------------------------------
  - type: web # Using a Node web service because Vite uses a proxy to the backend if not fully decoupled, but Static Site is better for production.
    name: weathergpt-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        sync: false # Set this to your backend URL + /api (e.g., https://your-backend.onrender.com/api)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
