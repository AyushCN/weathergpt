version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: weathergpt-postgres
    environment:
      POSTGRES_DB: weathergpt
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathergpt -d weathergpt"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weathergpt-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://weathergpt:weathergpt@postgres:5432/weathergpt
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
      - OPEN_METEO_BASE_URL=https://api.open-meteo.com/v1
      - OPEN_METEO_GEOCODING_URL=https://geocoding-api.open-meteo.com/v1
      - IMD_API_KEY=${IMD_API_KEY:-}
      - MODEL_DIR=/app/ml/models
      - TEMPERATURE_MODEL_PATH=temperature_model.pkl
      - RAIN_MODEL_PATH=rain_model.pkl
      - FETCH_INTERVAL_MINUTES=30
      - DEBUG=true
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    volumes:
      - ./backend:/app
      - ./ml/models:/app/ml/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weathergpt-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # Optional: ML Training service
  ml-trainer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weathergpt-ml-trainer
    environment:
      - DATABASE_URL=postgresql+asyncpg://weathergpt:weathergpt@postgres:5432/weathergpt
      - MODEL_DIR=/app/ml/models
    volumes:
      - ./backend:/app
      - ./ml/models:/app/ml/models
      - ./ml/train.py:/app/train.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - ml
    command: python train.py

volumes:
  postgres_data: