<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="64"/>
  
  <!-- Cloud -->
  <g transform="translate(120, 140)">
    <ellipse cx="120" cy="80" rx="90" ry="50" fill="url(#cloud)"/>
    <ellipse cx="40" cy="90" rx="50" ry="35" fill="url(#cloud)"/>
    <ellipse cx="180" cy="90" rx="50" ry="35" fill="url(#cloud)"/>
    <ellipse cx="100" cy="50" rx="40" ry="30" fill="url(#cloud)"/>
  </g>
  
  <!-- Sun peeking from behind cloud -->
  <circle cx="380" cy="160" r="70" fill="url(#sun)" opacity="0.9"/>
  <circle cx="380" cy="160" r="55" fill="#fbbf24" opacity="0.8"/>
  
  <!-- Sun rays -->
  <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="380" y1="60" x2="380" y2="40"/>
    <line x1="480" y2="160" x2="460" y1="160"/>
    <line x1="380" y1="260" x2="380" y2="280"/>
    <line x1="280" y1="160" x2="300" y2="160"/>
    <line x1="318" y1="92" x2="304" y2="106"/>
    <line x1="442" y1="92" x2="456" y2="106"/>
    <line x1="318" y1="228" x2="304" y2="242"/>
    <line x1="442" y1="228" x2="456" y2="242"/>
  </g>
  
  <!-- Temperature indicator -->
  <g transform="translate(400, 360)">
    <rect x="-40" y="-20" width="80" height="40" rx="20" fill="#0ea5e9" opacity="0.9"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="system-ui, sans-serif">28°C</text>
  </g>
  
  <!-- WeatherGPT text -->
  <text x="256" y="460" text-anchor="middle" fill="white" font-size="32" font-weight="bold" font-family="system-ui, sans-serif" opacity="0.9">WeatherGPT</text>
  <text x="256" y="490" text-anchor="middle" fill="white" font-size="16" font-family="system-ui, sans-serif" opacity="0.7">AI Weather Intelligence</text>
</svg>